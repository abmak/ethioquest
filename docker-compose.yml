name: ethioquest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethioquest
      POSTGRES_PASSWORD: ethioquest
      POSTGRES_DB: ethioquest
    ports:
      - "5435:5432"
    volumes:
      - ethioquest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethioquest -d ethioquest"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://ethioquest:ethioquest@db:5432/ethioquest?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-48-byte-random-hex-string}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
    volumes:
      - uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  ethioquest-data:
  uploads:
